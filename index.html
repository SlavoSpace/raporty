@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tlo:#0B0F0D;--pow:#121915;--pow2:#101613;--pow3:#18211C;--wybrany:#16201B;--linia:#1E2823;--ramka:#24302A;--ramka2:#33423A;--tekst:#EEF4F0;--tekst2:#9DAEA4;--tekst3:#85948B;--akcja:#5DFF8A;--naAkcji:#052012;--wolne:#5DFF8A;--pelne:#FFC85C;--zaduzo:#FF7A7A;--moc:#7CC0FF;--odwrotne:#EEF4F0;--naOdwrotnym:#0B0F0D;--aktywny:#EEF4F0;--naAktywnym:#0B0F0D;--nieaktywny:#C9D6CF;--cien:rgba(0,0,0,.5);--wylaczony:#1F2924;--naWylaczonym:#85948B;--okTlo:#14241B;--okRamka:#2F6B47;--okTekst:#8CF5B0;--uwTlo:#2A2213;--uwRamka:#6E5422;--uwTekst:#FFD27A;--blTlo:#2A1616;--blRamka:#5C2B2B;--blTekst:#FF9B9B;--mocTlo:#15283D;--mocRamka:#2B4C70;--mocTekst:#9CCFFF;--zaslona:rgba(0,0,0,.62);--R:#E3A882;--F:#9CC7A6;--T:#8DB6E0;--karty:#7CB7FF;--gotowka:#D29BFF;--razem:#FF8A8A;color-scheme:dark}}
:root[data-theme="dark"]{--tlo:#0B0F0D;--pow:#121915;--pow2:#101613;--pow3:#18211C;--wybrany:#16201B;--linia:#1E2823;--ramka:#24302A;--ramka2:#33423A;--tekst:#EEF4F0;--tekst2:#9DAEA4;--tekst3:#85948B;--akcja:#5DFF8A;--naAkcji:#052012;--wolne:#5DFF8A;--pelne:#FFC85C;--zaduzo:#FF7A7A;--moc:#7CC0FF;--odwrotne:#EEF4F0;--naOdwrotnym:#0B0F0D;--aktywny:#EEF4F0;--naAktywnym:#0B0F0D;--nieaktywny:#C9D6CF;--cien:rgba(0,0,0,.5);--wylaczony:#1F2924;--naWylaczonym:#85948B;--okTlo:#14241B;--okRamka:#2F6B47;--okTekst:#8CF5B0;--uwTlo:#2A2213;--uwRamka:#6E5422;--uwTekst:#FFD27A;--blTlo:#2A1616;--blRamka:#5C2B2B;--blTekst:#FF9B9B;--mocTlo:#15283D;--mocRamka:#2B4C70;--mocTekst:#9CCFFF;--zaslona:rgba(0,0,0,.62);--R:#E3A882;--F:#9CC7A6;--T:#8DB6E0;--karty:#7CB7FF;--gotowka:#D29BFF;--razem:#FF8A8A;color-scheme:dark}
:root.ciemny{--tlo:#0B0F0D;--pow:#121915;--pow2:#101613;--pow3:#18211C;--wybrany:#16201B;--linia:#1E2823;--ramka:#24302A;--ramka2:#33423A;--tekst:#EEF4F0;--tekst2:#9DAEA4;--tekst3:#85948B;--akcja:#5DFF8A;--naAkcji:#052012;--wolne:#5DFF8A;--pelne:#FFC85C;--zaduzo:#FF7A7A;--moc:#7CC0FF;--odwrotne:#EEF4F0;--naOdwrotnym:#0B0F0D;--aktywny:#EEF4F0;--naAktywnym:#0B0F0D;--nieaktywny:#C9D6CF;--cien:rgba(0,0,0,.5);--wylaczony:#1F2924;--naWylaczonym:#85948B;--okTlo:#14241B;--okRamka:#2F6B47;--okTekst:#8CF5B0;--uwTlo:#2A2213;--uwRamka:#6E5422;--uwTekst:#FFD27A;--blTlo:#2A1616;--blRamka:#5C2B2B;--blTekst:#FF9B9B;--mocTlo:#15283D;--mocRamka:#2B4C70;--mocTekst:#9CCFFF;--zaslona:rgba(0,0,0,.62);--R:#E3A882;--F:#9CC7A6;--T:#8DB6E0;--karty:#7CB7FF;--gotowka:#D29BFF;--razem:#FF8A8A;color-scheme:dark}
:root.jasny{--tlo:#F3F6F4;--pow:#FFFFFF;--pow2:#FAFCFB;--pow3:#EEF3F0;--wybrany:#E6F3EA;--linia:#DCE4DF;--ramka:#D3DDD7;--ramka2:#C2CFC8;--tekst:#13201A;--tekst2:#4B5D53;--tekst3:#5F7067;--akcja:#0F7A39;--naAkcji:#FFFFFF;--wolne:#0F7A39;--pelne:#9A5B00;--zaduzo:#C62828;--moc:#1E63B5;--odwrotne:#13201A;--naOdwrotnym:#FFFFFF;--aktywny:#13201A;--naAktywnym:#FFFFFF;--nieaktywny:#3B4C43;--cien:rgba(19,32,26,.18);--wylaczony:#E3EAE6;--naWylaczonym:#5F7067;--okTlo:#E6F5EC;--okRamka:#8CCBA3;--okTekst:#145C33;--uwTlo:#FFF4DE;--uwRamka:#E3BE73;--uwTekst:#7A4700;--blTlo:#FDECEC;--blRamka:#EBB4B4;--blTekst:#9E1C1C;--mocTlo:#E2EDFB;--mocRamka:#93B6E6;--mocTekst:#1C4F8F;--zaslona:rgba(19,32,26,.42);--R:#A9714E;--F:#5E8367;--T:#4A7196;--karty:#1565C0;--gotowka:#6A1B9A;--razem:#C62828;color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--tlo);color:var(--tekst);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--tlo)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
button:disabled,button[aria-disabled="true"]{cursor:default}
button:active:not(:disabled):not([aria-disabled="true"]){filter:brightness(.93)}
:focus{outline:none}
:focus-visible{outline:3px solid var(--moc);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--tekst)}
svg{display:block;flex:0 0 auto}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
.bebas{font-family:"Bebas Neue","Avenir Next Condensed","Roboto Condensed","Arial Narrow",Inter,sans-serif;font-weight:400;letter-spacing:.05em;line-height:1}
.etykieta{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tekst3)}
.cyfry{font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
@keyframes potrzasnij{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.potrzasnij{animation:potrzasnij .4s ease}
@keyframes wjazd{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes mrug{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.potrzasnij,.arkusz,#toast,.kursor{animation:none!important}}

/* nagłówek — jak w Tablicy i Spisie */
.nag{flex:0 0 auto;height:60px;display:flex;align-items:center;gap:14px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--linia);background:var(--tlo);position:relative;z-index:5}
.nag-l{display:flex;align-items:center;gap:12px;flex:0 1 auto;min-width:0;overflow:hidden}
.nag-tyt{font-size:30px;padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nag-s{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px}
.nag-p{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.nag-data{font-size:14px;color:var(--tekst2);white-space:nowrap}
.nag-zegar{font-size:30px;padding-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pol{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--wolne)}
.pol .kropka{width:8px;height:8px;border-radius:50%;background:currentColor}
.pol[data-stan="offline"]{color:var(--zaduzo)}
.pol[data-stan="wysyla"]{color:var(--pelne)}
.menu-btn{height:42px;max-width:170px;padding:0 10px 0 6px;border-radius:11px;border:1px solid var(--ramka);background:var(--pow);color:var(--tekst);display:flex;align-items:center;gap:8px;min-width:0}
.awatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--pow3);border:1px solid var(--ramka2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.awatar.duzy{width:36px;height:36px;flex-basis:36px;font-size:16px}
.menu-imie{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip-rap{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--ramka);background:var(--pow);font-size:14px;font-weight:700;white-space:nowrap;min-width:0;max-width:100%}
.chip-rap span{overflow:hidden;text-overflow:ellipsis}
.chip-rap::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--kol);flex:0 0 auto}
.pasek-p{height:3px;background:var(--linia);flex:0 0 auto}
.pasek-p>i{display:block;height:100%;background:var(--kol,var(--akcja));transition:width .3s}
@media (max-width:760px){.nag{padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));gap:8px;height:56px}.nag-tyt{font-size:26px}.nag-data,.menu-imie,.pol .pol-t,.tyt-dl{display:none}.nag-zegar{font-size:24px}.menu-btn{padding:0 5px;gap:4px}.nag-p{gap:8px}}
@media (max-width:400px){.chip-rap{display:none}}

/* przyciski */
.glowny{height:56px;padding:0 22px;border-radius:16px;background:var(--akcja);color:var(--naAkcji);font-size:17px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.glowny:disabled,.glowny[aria-disabled="true"]{background:var(--wylaczony);color:var(--naWylaczonym)}
.glowny.ciemny{background:var(--aktywny);color:var(--naAktywnym)}
.drugi{min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--ramka2);background:transparent;color:var(--tekst);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.drugi.maly{min-height:38px;padding:0 12px;border-radius:11px;font-size:14px}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--mocTekst);font-weight:700;font-size:14px;min-height:36px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--pow);border:1px solid var(--ramka)}
.seg button{height:34px;min-width:46px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:700;color:var(--nieaktywny);display:flex;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--aktywny);color:var(--naAktywnym)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 10px;border-radius:8px;border:1px solid var(--ramka);background:var(--pow);font-size:13px;font-weight:600;color:var(--tekst2)}
.chip b{color:var(--tekst)}
.kl{height:64px;border-radius:16px;border:1px solid var(--ramka);background:var(--pow);color:var(--tekst);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.kl.maly{font-size:16px;font-weight:700;color:var(--tekst2)}
.kl:disabled{opacity:.35}

/* start i PIN */
.przew{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.start-w{width:min(760px,100%);margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 36px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.start-gora{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.start-logo{font-size:56px}
.start-pod{font-size:14px;color:var(--tekst2);display:block;margin-top:6px}
.kafelki{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.kafelki{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kafel{min-height:96px;padding:12px 14px;border-radius:16px;border:1px solid var(--ramka);background:var(--pow);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;text-align:left}
.kafel-imie{font-size:18px;font-weight:800}
.kafel-konto{font-size:12px;color:var(--tekst2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.znacznik{display:inline-block;padding:0 5px;border-radius:5px;border:1px solid var(--ramka2);font-size:11px;font-weight:700;color:var(--tekst2);line-height:16px}
.kafel-inna{border-style:dashed;border-color:var(--ramka2);background:transparent;color:var(--tekst2);font-size:16px;font-weight:700;align-items:center}
.wskazowki{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.wskazowki ol{margin:0;padding-left:1.3em;display:grid;gap:6px;color:var(--tekst2);font-size:14px;max-width:72ch}
.wskazowki b{color:var(--tekst)}
.karta-plan{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--mocRamka);background:var(--mocTlo);color:var(--mocTekst);text-align:left;width:100%}
.karta-plan b{display:block;font-size:17px;color:var(--tekst)}
.karta-plan span span{font-size:14px}
.start-stopka{font-size:13px;color:var(--tekst3);max-width:72ch}
.pin{width:min(400px,100%);align-self:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.pin-imie{font-size:28px;font-weight:800}
.pin-pod{font-size:15px;color:var(--tekst2)}
.kropki{display:flex;gap:12px;height:22px;align-items:center}
.kropki span{width:16px;height:16px;border-radius:8px;border:2px solid var(--ramka2)}
.kropki span.p{background:var(--tekst);border-color:var(--tekst)}
.klaw-pin{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pin-hint{font-size:13px;color:var(--tekst2);text-align:center}

/* wybór raportu */
.wyb-w{width:min(760px,100%);margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.h1{font-size:26px;font-weight:800;line-height:1.2}
.pod{font-size:14px;color:var(--tekst2);max-width:62ch}
.pod b{color:var(--tekst)}
.rap-k{position:relative;display:flex;align-items:stretch;min-height:96px;border-radius:16px;border:1px solid var(--ramka);background:var(--pow);text-align:left;overflow:hidden;width:100%}
.rap-k .pas{width:8px;background:var(--kol);flex:0 0 8px}
.rap-k .tr{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rap-k .naz{font-size:18px;font-weight:800;line-height:1.25}
.rap-k .meta{font-size:13px;color:var(--tekst2)}
.st{font-size:13px;font-weight:600;color:var(--tekst3)}
.st.ok{color:var(--okTekst)}.st.toku{color:var(--mocTekst)}.st.al{color:var(--zaduzo)}.st.uw{color:var(--uwTekst)}
.rap-k .str{align-self:center;padding-right:14px;color:var(--tekst3)}
.jezyk{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.jezyk small{font-size:12px;color:var(--tekst3)}
.gora-r{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.karta-kier{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--mocRamka);background:var(--mocTlo);color:var(--mocTekst);text-align:left;width:100%}
.karta-kier b{display:block;font-size:17px;color:var(--tekst)}

/* raport: kroki */
.rap-gl{flex:1;min-height:0;display:flex;flex-direction:column}
.rap-przew{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.rap-w{width:min(640px,100%);margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.krok-gora{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
.krok-gora .etykieta{white-space:nowrap}
.krok-tyt{font-size:26px;font-weight:800;line-height:1.15}
.krok-pom{font-size:14px;color:var(--tekst2);margin-top:-6px}
.data-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--tekst2)}
.data-r b{color:var(--tekst)}
.pola{display:flex;flex-direction:column;border:1px solid var(--ramka);border-radius:16px;background:var(--pow);overflow:hidden}
.pole{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border-top:1px solid var(--linia);text-align:left}
.pole:first-child{border-top:0}
.pole .opis{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pole .naz{font-size:16px;font-weight:700;line-height:1.25}
.pole .pom{font-size:12px;color:var(--tekst3);line-height:1.3}
.pole .war{flex:0 0 auto;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pole .war small{font-size:13px;font-weight:600;color:var(--tekst3);margin-left:4px}
.pole.puste .war{font-size:14px;font-weight:700;color:var(--mocTekst);border:1px dashed var(--mocRamka);border-radius:10px;padding:6px 10px}
.pole.wyl{background:var(--wybrany)}
.pole.suma{min-height:52px;background:var(--pow2);cursor:default}
.pole.suma .naz{font-size:15px;text-decoration:underline;text-underline-offset:3px}
.pole.suma .war{font-size:18px}
.taknie{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.taknie button{min-height:56px;border-radius:14px;border:1px solid var(--ramka2);background:var(--pow);font-size:17px;font-weight:800;text-align:center}
.taknie button[aria-pressed="true"]{background:var(--aktywny);color:var(--naAktywnym);border-color:var(--aktywny)}
.pytanie{font-size:17px;font-weight:700}
.poz-l{display:flex;flex-direction:column;gap:10px}
.poz{border:1px solid var(--ramka);border-radius:16px;background:var(--pow);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.poz .nr{font-size:12px;font-weight:700;color:var(--tekst3);grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.poz input{width:100%;height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--ramka2);background:var(--pow2);font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.poz input:focus{border-color:var(--moc)}
.poz .kw{min-width:118px;height:48px;padding:0 12px;border-radius:12px;border:1px dashed var(--mocRamka);color:var(--mocTekst);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.poz .kw.jest{border:1px solid var(--ramka2);color:var(--tekst)}
.pole-tekst{width:100%;min-height:110px;padding:12px 14px;border-radius:14px;border:1px solid var(--ramka2);background:var(--pow);font-size:16px;resize:vertical;outline:none;-webkit-user-select:text;user-select:text}
.pole-tekst:focus{border-color:var(--moc)}

.pole-in:focus{border-color:var(--moc)}
.pole-l{display:flex;flex-direction:column;gap:6px}
.logowanie{width:min(420px,100%);align-self:center;display:flex;flex-direction:column;gap:12px}
.logowanie .glowny,.pin .glowny{width:100%}
.blad-t{min-height:20px;font-size:14px;font-weight:700;color:var(--zaduzo);text-align:center}
.pod-t{font-size:13px;color:var(--tekst2)}
.kafel-w{position:relative}
.kafel-w .kafel{width:100%}
.kafel-x{position:absolute;top:-8px;right:-8px;width:34px;height:34px;border-radius:17px;background:var(--zaduzo);color:var(--naOdwrotnym);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center}
.start-rzad{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ladowanie{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 16px;text-align:center;color:var(--tekst2)}
.krecik{width:44px;height:44px;border-radius:50%;border:4px solid var(--ramka2);border-top-color:var(--akcja);animation:obrot 1s linear infinite}
@media (prefers-reduced-motion:reduce){.krecik{animation-duration:3s}}
.konto-w{width:min(520px,100%);margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center}
.nowa-w{height:36px;padding:0 12px;border-radius:10px;background:var(--akcja);color:var(--naAkcji);font-size:13px;font-weight:800;white-space:nowrap}
.chip-proba{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--uwRamka);background:var(--uwTlo);color:var(--uwTekst);font-size:12px;font-weight:800;letter-spacing:.06em;white-space:nowrap}
.hist-ladowanie{font-size:14px;color:var(--tekst2);padding:8px 0}
@media (max-width:760px){.nowa-w{padding:0 8px}.chip-proba{display:none}}
.baner{flex:0 0 auto;padding:9px 20px;background:var(--mocTlo);color:var(--mocTekst);border-bottom:1px solid var(--mocRamka);font-size:14px;font-weight:600;display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.baner.uw{background:var(--uwTlo);color:var(--uwTekst);border-color:var(--uwRamka)}
.baner.bl{background:var(--blTlo);color:var(--blTekst);border-color:var(--blRamka)}
.info-ok{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--okRamka);background:var(--okTlo);color:var(--okTekst);font-weight:700;font-size:15px}
.info-uw{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--uwRamka);background:var(--uwTlo);color:var(--uwTekst);font-weight:600;font-size:14px}
.sd-gora{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
/* ===== konta raportów (jak „Konta spisu”) ===== */
.kn-w{width:min(1200px,100%);margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
.kn-siatka{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.kn-nowe .glowny{width:100%}
.kn-rr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kn-r{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 10px 6px 0;border-radius:12px;border:1px solid var(--ramka);background:var(--pow2);font-size:15px;font-weight:700;text-align:left;overflow:hidden;line-height:1.2}
.kn-r .pas{align-self:stretch;width:6px;flex:0 0 6px;background:var(--kol)}
.kn-r.wyb{border-color:var(--kol);box-shadow:0 0 0 2px var(--kol);background:var(--pow)}
.kn-pin{display:flex;gap:8px;align-items:stretch}
.kn-pin .pole-in{flex:1;min-width:0;font-variant-numeric:tabular-nums;letter-spacing:.14em}
.kn-dane{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;align-items:baseline;padding:14px 16px;border-radius:14px;border:1px solid var(--okRamka);background:var(--okTlo)}
.kn-dane b{font-size:17px;overflow-wrap:anywhere}
.kn-duze{font-size:30px!important;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.kn-lnag{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kn-lista{display:flex;flex-direction:column;gap:14px}
.kn-grupa{display:flex;flex-direction:column;gap:6px}
.kn-gnag{display:flex;align-items:center;gap:8px;font-size:14px}
.kn-gnag span:last-child{margin-left:auto;font-size:13px;color:var(--tekst3)}
.kn-kw{width:10px;height:10px;border-radius:3px;background:var(--kol);flex:0 0 auto}
.kn-osoba{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;border-radius:12px;border:1px solid var(--ramka);background:var(--pow2);text-align:left}
.kn-osoba .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.kn-osoba b{font-size:15px}
.kn-osoba small{font-size:12px;color:var(--tekst2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kn-osoba.zabl{opacity:.65}
.kn-zmien{font-size:13px;font-weight:700;color:var(--mocTekst);flex:0 0 auto}
.kn-sek{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--linia)}
.kn-sek h3{margin:0;font-size:15px;font-weight:800}
.kn-sek .drugi{align-self:flex-start}
@media (max-width:960px){.kn-siatka{grid-template-columns:1fr}}
@media (max-width:520px){.kn-rr{grid-template-columns:repeat(2,minmax(0,1fr))}.kn-duze{font-size:26px!important}}
.ark-konto .ark-tresc>*{flex-shrink:0}
.ark-konto .ark-tresc>.glowny{width:100%}
